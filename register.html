<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — Gracious Word Global Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/register.css" />
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
<a href="#mainContent" class="skip-link">Skip to main content</a>

<header class="reg-header">
  <a href="index.html" class="reg-logo">
    <span class="logo-badge">GW</span>
    <span>Gracious Word Global Mission</span>
  </a>
</header>

<main id="mainContent" class="reg-wrap">
  <h1 class="font-display reg-title">Member Registration</h1>
  <p class="reg-subtitle">Fill in your details below. Your membership ID and digital card will be generated automatically.</p>

  <form id="registerForm" class="reg-form" novalidate>

    <!-- Photo upload -->
    <div class="form-group photo-group">
      <label for="profilePhoto">Passport Photograph <span class="req">*</span></label>
      <div class="photo-preview" id="photoPreview" aria-live="polite">
        <i data-feather="user" class="w-10 h-10"></i>
      </div>
      <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" required />
      <small class="hint">JPEG or PNG, clear passport-style photo.</small>
      <span class="field-error" id="err-profilePhoto" role="alert"></span>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="firstName">First Name <span class="req">*</span></label>
        <input type="text" id="firstName" name="firstName" required autocomplete="given-name" />
        <span class="field-error" id="err-firstName" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name <span class="req">*</span></label>
        <input type="text" id="lastName" name="lastName" required autocomplete="family-name" />
        <span class="field-error" id="err-lastName" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="gender">Gender <span class="req">*</span></label>
        <select id="gender" name="gender" required>
          <option value="" disabled selected>Select</option>
          <option>Male</option>
          <option>Female</option>
        </select>
        <span class="field-error" id="err-gender" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth <span class="req">*</span></label>
        <input type="date" id="dob" name="dob" required autocomplete="bday" />
        <span class="field-error" id="err-dob" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel" />
        <span class="field-error" id="err-phone" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp Number</label>
        <input type="tel" id="whatsapp" name="whatsapp" autocomplete="tel" />
        <span class="field-error" id="err-whatsapp" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <span class="field-error" id="err-email" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="occupation">Occupation</label>
        <input type="text" id="occupation" name="occupation" />
      </div>

      <div class="form-group form-grid-span2">
        <label for="address">Residential Address <span class="req">*</span></label>
        <input type="text" id="address" name="address" required autocomplete="street-address" />
        <span class="field-error" id="err-address" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="state">State <span class="req">*</span></label>
        <input type="text" id="state" name="state" required />
        <span class="field-error" id="err-state" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="country">Country <span class="req">*</span></label>
        <input type="text" id="country" name="country" required value="Nigeria" />
        <span class="field-error" id="err-country" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="branch">Branch <span class="req">*</span></label>
        <select id="branch" name="branch" required>
          <option value="" disabled selected>Select branch</option>
          <option>Uyo City Headquarters</option>
          <option>Port Harcourt Branch</option>
          <option>Eket Branch</option>
          <option>AKSU Branch</option>
        </select>
        <span class="field-error" id="err-branch" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="position">Position Held</label>
        <input type="text" id="position" name="position" placeholder="e.g. Member, Usher, Choir" />
      </div>
    </div>

    <div id="formLevelError" class="form-level-error" role="alert" aria-live="assertive"></div>

    <button type="submit" id="submitBtn" class="btn btn-primary reg-submit">
      <i data-feather="check-circle"></i> Register
    </button>
  </form>
</main>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/register.js"></script>
<script>feather.replace();</script>
</body>
</html>
